name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tính số phiên bản
        run: echo "VERSION_CODE=$((GITHUB_RUN_NUMBER + 100))" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build
        run: gradle --no-daemon assembleRelease

      - name: Chuẩn bị file
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/3in1.apk
          echo "{\"versionCode\": $VERSION_CODE, \"versionName\": \"2.$VERSION_CODE\", \"apk\": \"https://github.com/${{ github.repository }}/releases/download/latest/3in1.apk\"}" > out/version.json
          cat out/version.json

      - uses: actions/upload-artifact@v4
        with:
          name: 3in1-apk
          path: out/3in1.apk

      - name: Đăng lên Releases (tag latest)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest out/3in1.apk out/version.json --title "Bản mới nhất" --notes "Bản $VERSION_CODE" --latest
